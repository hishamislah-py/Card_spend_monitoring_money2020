# Openship deploy: one container serving ui/ and the JSON/SSE API on :8000. Case state lives on the card-data volume.
services:
  app:
    build: .
    ports:
      - "8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - card-data:/app/data
    restart: unless-stopped
volumes:
  card-data:
